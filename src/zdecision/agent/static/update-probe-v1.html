<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZDecision UI capability probe</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 12px;
        background: transparent;
      }

      main {
        display: grid;
        gap: 10px;
        max-width: 360px;
        padding: 14px;
        border: 1px solid color-mix(in srgb, currentColor 18%, transparent);
        border-radius: 12px;
      }

      h2,
      p {
        margin: 0;
      }

      h2 {
        font-size: 16px;
      }

      p {
        font-size: 13px;
        opacity: 0.72;
      }

      button {
        width: fit-content;
        min-height: 36px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.55;
      }

      #status[data-state="success"] {
        color: #16a34a;
        opacity: 1;
      }

      #status[data-state="error"] {
        color: #dc2626;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <h2>ZDecision</h2>
      <p>这是 UI 能力探针，不会启动决策采集。</p>
      <button id="update" type="button" disabled>更新候选决策</button>
      <p id="status" role="status">正在连接 Codex MCP Apps Bridge…</p>
    </main>

    <script>
      const button = document.getElementById("update");
      const status = document.getElementById("status");
      const pending = new Map();
      let nextRequestId = 1;

      function request(method, params) {
        const id = nextRequestId++;
        window.parent.postMessage(
          { jsonrpc: "2.0", id, method, params },
          "*",
        );
        return new Promise((resolve, reject) => {
          pending.set(id, { resolve, reject });
        });
      }

      function notify(method, params) {
        window.parent.postMessage(
          { jsonrpc: "2.0", method, params },
          "*",
        );
      }

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (Object.hasOwn(message, "id")) {
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) {
              waiter.reject(message.error);
            } else {
              waiter.resolve(message.result);
            }
          }
        },
        { passive: true },
      );

      const bridgeReady = request("ui/initialize", {
        appInfo: { name: "zdecision-update-probe", version: "0.1.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      }).then(() => {
        notify("ui/notifications/initialized", {});
        button.disabled = false;
        status.textContent = "桥接成功，可以点击验证回调。";
      });

      bridgeReady.catch(() => {
        status.dataset.state = "error";
        status.textContent = "当前宿主没有初始化 MCP Apps UI。";
      });

      button.addEventListener("click", async () => {
        button.disabled = true;
        status.dataset.state = "";
        status.textContent = "正在验证按钮回调…";
        try {
          await bridgeReady;
          const result = await request("tools/call", {
            name: "acknowledge_zdecision_update",
            arguments: { action_id: "ui_probe_v1" },
          });
          if (result?.structuredContent?.probe_acknowledged !== true) {
            throw new Error("probe acknowledgement missing");
          }
          status.dataset.state = "success";
          status.textContent = "验证成功：Codex 已收到按钮回调。";
        } catch {
          status.dataset.state = "error";
          status.textContent = "按钮已显示，但工具回调失败。";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
