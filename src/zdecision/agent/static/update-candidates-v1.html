<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZDecision 候选决策更新</title>
    <style>
      :root {
        color-scheme: light dark;
        --paper: light-dark(#f3f0e8, #171715);
        --ink: light-dark(#181815, #f1eee5);
        --muted: light-dark(#68665f, #aaa69b);
        --rule: light-dark(#b9b4a8, #514f49);
        --accent: light-dark(#a83d24, #ef7658);
        --serif: "Iowan Old Style", "Songti SC", "STSong", ui-serif, serif;
        --mono: "SFMono-Regular", "Cascadia Mono", "Menlo", ui-monospace,
          monospace;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 10px;
        background: transparent;
        color: var(--ink);
      }

      main {
        width: min(100%, 430px);
        border: 1px solid var(--rule);
        border-radius: 3px;
        background: var(--paper);
        box-shadow: 3px 3px 0 color-mix(in srgb, var(--ink) 10%, transparent);
      }

      header {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: end;
        gap: 16px;
        padding: 14px 16px 12px;
        border-bottom: 1px solid var(--rule);
      }

      .kicker,
      .index,
      #status {
        font-family: var(--mono);
        letter-spacing: 0.08em;
      }

      .kicker {
        margin: 0 0 4px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 650;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.025em;
        line-height: 1.05;
      }

      .index {
        color: var(--muted);
        font-size: 10px;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 12px 16px;
      }

      button {
        min-height: 40px;
        padding: 8px 10px;
        border: 1px solid var(--ink);
        border-radius: 2px;
        background: transparent;
        color: var(--ink);
        font-family: var(--serif);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: var(--ink);
        color: var(--paper);
      }

      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      button:disabled {
        border-color: var(--rule);
        color: var(--muted);
        cursor: not-allowed;
        opacity: 0.62;
      }

      footer {
        display: flex;
        min-height: 41px;
        align-items: center;
        flex-wrap: wrap;
        justify-content: space-between;
        gap: 12px;
        padding: 9px 16px 10px;
        border-top: 1px solid var(--rule);
      }

      #status {
        margin: 0;
        color: var(--accent);
        font-size: 11px;
        line-height: 1.4;
      }

      #status:empty {
        display: none;
      }

      #page-address {
        flex: 1 0 100%;
        margin: 0;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 9px;
        line-height: 1.4;
        overflow-wrap: anywhere;
        user-select: text;
      }

      #page-address[hidden] {
        display: none;
      }

      #open-page {
        min-height: 30px;
        flex: 0 0 auto;
        padding: 4px 8px;
        border-color: var(--accent);
        color: var(--accent);
        font-family: var(--mono);
        font-size: 10px;
      }

      #open-page[hidden] {
        display: none;
      }

      @media (max-width: 360px) {
        .actions {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <header>
        <div>
          <p class="kicker">ZDecision / Refresh</p>
          <h1 id="title">更新候选决策</h1>
        </div>
        <span class="index" aria-hidden="true">01—02</span>
      </header>

      <div class="actions" aria-label="选择更新范围">
        <button id="current" type="button" disabled>当前 Session</button>
        <button id="all" type="button" disabled>所有有效 Session</button>
      </div>

      <footer>
        <p id="status" role="status" aria-live="polite"></p>
        <button id="open-page" type="button" hidden>打开候选决策页面</button>
        <p id="page-address" aria-label="候选决策页面地址" hidden></p>
      </footer>
    </main>

    <script>
      const currentButton = document.getElementById("current");
      const allButton = document.getElementById("all");
      const openPageButton = document.getElementById("open-page");
      const pageAddress = document.getElementById("page-address");
      const status = document.getElementById("status");
      const pending = new Map();
      const activeStates = new Set([
        "creating", "queued", "capturing", "syncing", "retrying",
      ]);
      const labels = {
        creating: "正在创建更新请求",
        submitting: "正在提交更新请求",
        queued: "等待本地设备",
        capturing: "正在整理候选决策",
        syncing: "正在同步候选决策",
        retrying: "连接暂时中断，正在重试",
        busy: "已有更新正在进行",
        unavailable: "暂时无法更新",
        failed: "本次更新未完成",
        empty: "没有发现新的候选决策",
      };

      let nextRequestId = 1;
      let initialized = false;
      let initialResultAccepted = false;
      let restorationStarted = false;
      let selected = false;
      let chosenScope = null;
      let submissionState = null;
      let controlId = null;
      let safeState = "disabled";
      let pageUrl = null;
      let hostCapabilities = {};

      function request(method, params, timeoutMs = null) {
        const id = nextRequestId++;
        window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        return new Promise((resolve, reject) => {
          let timeoutId = null;
          pending.set(id, {
            resolve(value) {
              if (timeoutId !== null) clearTimeout(timeoutId);
              resolve(value);
            },
            reject(error) {
              if (timeoutId !== null) clearTimeout(timeoutId);
              reject(error);
            },
          });
          if (Number.isFinite(timeoutMs) && timeoutMs > 0) {
            timeoutId = setTimeout(() => {
              if (!pending.delete(id)) return;
              reject(new Error("request_timeout"));
            }, timeoutMs);
          }
        });
      }

      function notify(method, params) {
        window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      }

      function lockActions() {
        currentButton.disabled = true;
        allButton.disabled = true;
      }

      function updateInitialAvailability() {
        const enabled = initialized
          && initialResultAccepted
          && submissionState === "ready"
          && !selected
          && typeof controlId === "string";
        currentButton.disabled = !enabled;
        allButton.disabled = !enabled;
      }

      function boundedResult(result) {
        const toolResult = result?.structuredContent
          ? result
          : result?.toolResult;
        const value = toolResult?.structuredContent;
        if (
          toolResult?.isError === true
          || !value
          || typeof value.safe_state !== "string"
        ) {
          return {
            valid: false,
            safe_state: "unavailable",
            candidate_revision_count: null,
            candidate_page_url: null,
            submission_state: null,
            chosen_scope: null,
          };
        }
        const knownStates = new Set([
          "ready", "submitting", "queued", "capturing", "syncing", "retrying",
          "busy", "unavailable", "failed", "empty", "succeeded",
        ]);
        const knownSubmissionStates = new Set([
          "ready", "pending", "attached", "busy", "rejected", "legacy_unknown",
        ]);
        const persistedScope = value.chosen_scope;
        const hasPersistedScope =
          persistedScope === "current_session"
          || persistedScope === "all_valid_sessions";
        const stateIsConsistent =
          (value.submission_state === "ready"
            && value.safe_state === "ready"
            && persistedScope === null)
          || (value.submission_state === "pending"
            && value.safe_state === "submitting"
            && hasPersistedScope)
          || (value.submission_state === "attached"
            && !["ready", "submitting", "busy"].includes(value.safe_state)
            && hasPersistedScope)
          || (value.submission_state === "busy"
            && value.safe_state === "busy"
            && hasPersistedScope)
          || (["rejected", "legacy_unknown"].includes(value.submission_state)
            && value.safe_state === "failed"
            && hasPersistedScope);
        const candidateRevisionCount =
          Number.isSafeInteger(value.candidate_revision_count) &&
          value.candidate_revision_count >= 0
            ? value.candidate_revision_count
            : null;
        const candidatePageUrl = typeof value.candidate_page_url === "string"
          ? value.candidate_page_url
          : null;
        return {
          valid: knownStates.has(value.safe_state)
            && knownSubmissionStates.has(value.submission_state)
            && stateIsConsistent,
          safe_state: knownStates.has(value.safe_state) && stateIsConsistent
            ? value.safe_state : "unavailable",
          candidate_revision_count: candidateRevisionCount,
          candidate_page_url: candidatePageUrl,
          submission_state: stateIsConsistent ? value.submission_state : null,
          chosen_scope: hasPersistedScope ? persistedScope : null,
        };
      }

      function renderResult(value) {
        safeState = value.safe_state;
        pageUrl = value.candidate_page_url;
        if (safeState === "ready") {
          status.textContent = "";
        } else if (
          safeState === "succeeded" && value.candidate_revision_count > 0
        ) {
          status.textContent =
            `本次同步 ${value.candidate_revision_count} 条候选决策`;
        } else {
          status.textContent = labels[safeState] || labels.unavailable;
        }
        const canOpen = (safeState === "succeeded" || safeState === "empty")
          && typeof pageUrl === "string"
          && Boolean(hostCapabilities?.openLinks);
        openPageButton.hidden = !canOpen;
      }

      function acceptInitialResult(result) {
        const initial = result?.structuredContent;
        const enabled = initial?.actions_enabled;
        const meta = result?._meta;
        const metaControl = meta?.["zdecision/control_id"];
        const nextControlId = typeof metaControl === "string" ? metaControl : null;
        const isRenderResult = typeof enabled === "boolean"
          && (initial?.safe_state === "ready"
            || initial?.safe_state === "disabled"
            || initial?.safe_state === "submitting"
            || initial?.safe_state === "queued");
        if (selected || !isRenderResult) return;
        if (initialResultAccepted && nextControlId === controlId) return;

        if (enabled === true && initial.safe_state !== "ready") return;
        if (enabled && typeof metaControl !== "string") return;
        initialResultAccepted = true;
        restorationStarted = false;
        submissionState = null;
        chosenScope = null;
        controlId = nextControlId;
        lockActions();
        restoreInitialBinding();
      }

      window.addEventListener(
        "message",
        (event) => {
          if (event.source !== window.parent) return;
          const message = event.data;
          if (!message || message.jsonrpc !== "2.0") return;
          if (Object.hasOwn(message, "id")) {
            const waiter = pending.get(message.id);
            if (!waiter) return;
            pending.delete(message.id);
            if (message.error) waiter.reject(message.error);
            else waiter.resolve(message.result);
            return;
          }
          if (message.method === "ui/notifications/tool-input") {
            updateInitialAvailability();
          }
          if (message.method === "ui/notifications/tool-result") {
            acceptInitialResult(message.params);
          }
        },
        { passive: true },
      );

      async function poll() {
        if (submissionState !== "attached" || !activeStates.has(safeState)) {
          return;
        }
        try {
          const result = await request("tools/call", {
            name: "get_zdecision_candidate_refresh",
            arguments: { control_id: controlId },
          });
          applyBindingResult(result, "poll");
        } catch {
          safeState = "unavailable";
          status.textContent = labels.unavailable;
        }
      }

      async function start(scope, replay = false) {
        const canStart = replay
          ? submissionState === "pending" && scope === chosenScope
          : submissionState === "ready" && !selected;
        if (!canStart || !controlId) return;
        if (!replay) {
          selected = true;
          chosenScope = scope;
        }
        lockActions();
        safeState = "creating";
        status.textContent = labels.creating;
        try {
          const result = await request("tools/call", {
            name: "start_zdecision_candidate_refresh",
            arguments: { control_id: controlId, scope },
          });
          applyBindingResult(result, "start");
        } catch {
          safeState = "unavailable";
          status.textContent = labels.unavailable;
          setTimeout(restoreBinding, 1500);
        }
      }

      function applyBindingResult(result, source) {
        const value = boundedResult(result);
        if (!value.valid) {
          submissionState = null;
          safeState = "unavailable";
          lockActions();
          status.textContent = labels.unavailable;
          return;
        }
        submissionState = value.submission_state;
        chosenScope = value.chosen_scope;
        selected = submissionState !== "ready";
        renderResult(value);
        if (submissionState === "ready") {
          updateInitialAvailability();
          return;
        }
        lockActions();
        if (submissionState === "pending") {
          if (source === "restore") start(chosenScope, true);
          else setTimeout(() => start(chosenScope, true), 1500);
        } else if (
          submissionState === "attached" && activeStates.has(safeState)
        ) {
          setTimeout(poll, 1500);
        }
      }

      async function restoreBinding() {
        if (!initialized || !initialResultAccepted || !controlId) return;
        const requestedControlId = controlId;
        lockActions();
        try {
          const result = await request("tools/call", {
            name: "get_zdecision_candidate_refresh",
            arguments: { control_id: requestedControlId },
          });
          if (controlId !== requestedControlId) return;
          applyBindingResult(result, "restore");
        } catch {
          if (controlId !== requestedControlId) return;
          safeState = "unavailable";
          status.textContent = labels.unavailable;
          lockActions();
        }
      }

      function restoreInitialBinding() {
        if (restorationStarted || !initialized || !initialResultAccepted) return;
        restorationStarted = true;
        if (controlId) {
          restoreBinding();
        } else {
          safeState = "disabled";
          status.textContent = "";
          lockActions();
        }
      }

      currentButton.addEventListener("click", () => start("current_session"));
      allButton.addEventListener("click", () => start("all_valid_sessions"));
      openPageButton.addEventListener("click", async () => {
        if (!hostCapabilities?.openLinks || typeof pageUrl !== "string") return;
        const targetUrl = pageUrl;
        openPageButton.disabled = true;
        pageAddress.hidden = true;
        status.textContent = "正在打开候选决策页面";
        try {
          const result = await request("ui/open-link", { url: targetUrl }, 5000);
          if (result?.isError === true) throw new Error("open_link_rejected");
          status.textContent = "已请求在右侧浏览器打开";
          openPageButton.textContent = "再次打开候选决策页面";
        } catch {
          status.textContent = "页面未打开，请重试";
          openPageButton.textContent = "重试打开候选决策页面";
          pageAddress.textContent = targetUrl;
          pageAddress.hidden = false;
        } finally {
          openPageButton.disabled = false;
        }
      });

      request("ui/initialize", {
        appInfo: { name: "zdecision-candidate-refresh", version: "0.1.0" },
        appCapabilities: {},
        protocolVersion: "2026-01-26",
      })
        .then((result) => {
          hostCapabilities = result?.hostCapabilities || {};
          initialized = true;
          notify("ui/notifications/initialized", {});
          restoreInitialBinding();
        })
        .catch(() => {
          lockActions();
          status.textContent = labels.unavailable;
        });
    </script>
  </body>
</html>
