<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZDecision 宿主能力验证</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      body {
        margin: 0;
        color: #dce7f5;
        background: #111820;
      }
      main {
        padding: 18px;
      }
      .eyebrow {
        margin: 0 0 6px;
        color: #73a8ff;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }
      h1 {
        margin: 0;
        font-size: 19px;
      }
      .capabilities {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
        margin: 16px 0;
      }
      .capability {
        padding: 10px;
        border: 1px solid #334254;
        background: #18222d;
      }
      .capability span {
        display: block;
        color: #8fa3ba;
        font-size: 11px;
      }
      .capability strong {
        display: block;
        margin-top: 5px;
        font-size: 13px;
      }
      .result {
        padding: 12px;
        border-left: 3px solid #4f84d8;
        background: #18222d;
      }
      #probe-state {
        font-weight: 700;
      }
      #probe-status,
      #probe-receipt {
        margin: 5px 0 0;
        color: #9fb0c3;
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 11px 14px;
        border: 0;
        color: white;
        background: #2f73d9;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:disabled {
        color: #75869a;
        background: #26313d;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">ZDECISION / HOST PROBE</p>
      <h1>验证当前 Codex 的 MCP Apps 闭环</h1>
      <section class="capabilities" aria-label="宿主声明能力">
        <div class="capability">
          <span>APP-ONLY TOOL</span>
          <strong id="cap-server-tools">读取中</strong>
        </div>
        <div class="capability">
          <span>MODEL CONTEXT</span>
          <strong id="cap-update-context">读取中</strong>
        </div>
        <div class="capability">
          <span>FOLLOW-UP MESSAGE</span>
          <strong id="cap-message">读取中</strong>
        </div>
      </section>
      <section class="result" aria-live="polite">
        <div id="probe-state">正在初始化</div>
        <p id="probe-status">尚未执行任何变更操作。</p>
        <p id="probe-receipt"></p>
      </section>
      <button id="run-probe" type="button" disabled>运行宿主能力验证</button>
    </main>
    <script>
      (() => {
        "use strict";

        const PROTOCOL_VERSION = "2026-01-26";
        const PROBE_ID = /^probe_[A-Za-z0-9_-]{32}$/;
        const PROBE_MARKER = /^ZDECISION_HOST_PROBE_[A-Za-z0-9_-]{32}$/;
        const PROBE_RECEIPT = /^receipt_[A-Za-z0-9_-]{32}$/;
        const pending = new Map();
        let nextRequestId = 1;
        let initialized = false;
        let renderAccepted = false;
        let recoveryStarted = false;
        let actionStarted = false;
        let probeId = null;
        let hostCapabilities = null;
        let capabilityShapeValid = false;
        let supportsServerTools = false;
        let supportsContext = false;
        let supportsMessage = false;

        const serverTools = document.getElementById("cap-server-tools");
        const updateContext = document.getElementById("cap-update-context");
        const messageCapability = document.getElementById("cap-message");
        const state = document.getElementById("probe-state");
        const status = document.getElementById("probe-status");
        const receipt = document.getElementById("probe-receipt");
        const runButton = document.getElementById("run-probe");

        function isObject(value) {
          return value !== null && typeof value === "object" && !Array.isArray(value);
        }

        function optionalTextCapability(value) {
          return value === undefined || (isObject(value) && isObject(value.text));
        }

        function request(method, params, timeoutMs) {
          const id = nextRequestId++;
          return new Promise((resolve, reject) => {
            const timer = setTimeout(() => {
              pending.delete(id);
              reject(new Error(`${method} timed out`));
            }, timeoutMs);
            pending.set(id, { resolve, reject, timer });
            window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
          });
        }

        function notify(method, params) {
          window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
        }

        function setFailed(text) {
          state.textContent = "验证失败";
          status.textContent = text;
          runButton.disabled = true;
        }

        function setPartial(text) {
          state.textContent = "部分支持";
          status.textContent = text;
          runButton.disabled = true;
        }

        function showCapabilities(value) {
          hostCapabilities = isObject(value) ? value : {};
          supportsServerTools = isObject(hostCapabilities.serverTools);
          supportsContext = isObject(hostCapabilities.updateModelContext)
            && isObject(hostCapabilities.updateModelContext.text);
          supportsMessage = isObject(hostCapabilities.message)
            && isObject(hostCapabilities.message.text);
          capabilityShapeValid = supportsServerTools
            && optionalTextCapability(hostCapabilities.updateModelContext)
            && optionalTextCapability(hostCapabilities.message);
          serverTools.textContent = supportsServerTools ? "已声明" : "未支持";
          updateContext.textContent = supportsContext ? "已声明" : "未支持";
          messageCapability.textContent = supportsMessage ? "已声明" : "未支持";
          if (!capabilityShapeValid) {
            state.textContent = "宿主不支持";
            status.textContent = "宿主没有提供格式有效的 app-only 工具代理能力。";
            runButton.disabled = true;
          }
        }

        function parseSnapshot(value, expectedState) {
          if (!isObject(value) || !isObject(value.structuredContent)) return null;
          const structured = value.structuredContent;
          const meta = isObject(value._meta) ? value._meta : {};
          if (
            structured.probe_version !== 1
            || structured.state !== expectedState
            || !PROBE_ID.test(meta["zdecision/probe_id"] || "")
            || meta["zdecision/probe_id"] !== probeId
          ) return null;
          if (expectedState === "ready") {
            return { state: "ready" };
          }
          if (
            !PROBE_RECEIPT.test(structured.receipt || "")
            || typeof structured.committed_at !== "string"
            || !PROBE_MARKER.test(meta["zdecision/probe_marker"] || "")
          ) return null;
          return {
            state: "committed",
            marker: meta["zdecision/probe_marker"],
            receipt: structured.receipt,
          };
        }

        function acceptRenderResult(value) {
          if (!isObject(value) || !isObject(value.structuredContent)) {
            setFailed("卡片没有收到有效的只读验证坐标。");
            return;
          }
          const meta = isObject(value._meta) ? value._meta : {};
          const receivedId = meta["zdecision/probe_id"];
          if (
            value.structuredContent.probe_version !== 1
            || value.structuredContent.state !== "ready"
            || !PROBE_ID.test(receivedId || "")
          ) {
            setFailed("卡片没有收到有效的只读验证坐标。");
            return;
          }
          if (renderAccepted && probeId !== receivedId) {
            setFailed("卡片验证坐标发生变化。");
            return;
          }
          renderAccepted = true;
          probeId = receivedId;
          maybeRecover();
        }

        async function maybeRecover() {
          if (
            recoveryStarted
            || !initialized
            || !renderAccepted
            || !capabilityShapeValid
          ) return;
          recoveryStarted = true;
          try {
            const value = await request("tools/call", {
              name: "get_zdecision_recall_host_probe",
              arguments: { probe_id: probeId },
            }, 3000);
            const ready = parseSnapshot(value, "ready");
            if (ready !== null) {
              state.textContent = "准备就绪";
              status.textContent = "尚未执行变更操作；请点击一次开始验证。";
              runButton.disabled = false;
              return;
            }
            const committed = parseSnapshot(value, "committed");
            if (committed !== null) {
              state.textContent = "已恢复";
              status.textContent = "已从服务端恢复同一条权威验证结果。";
              receipt.textContent = committed.receipt;
              runButton.disabled = true;
              return;
            }
            setFailed("服务端返回了不匹配的验证状态。");
          } catch {
            setFailed("无法读取服务端验证状态。");
          }
        }

        async function runProbe() {
          if (actionStarted || runButton.disabled || !supportsServerTools) return;
          actionStarted = true;
          runButton.disabled = true;
          state.textContent = "正在验证";
          status.textContent = "正在提交一次 app-only 操作。";
          let committed;
          try {
            const value = await request("tools/call", {
              name: "run_zdecision_recall_host_probe",
              arguments: { probe_id: probeId },
            }, 5000);
            committed = parseSnapshot(value, "committed");
            if (committed === null) {
              setFailed("服务端返回的验证身份不匹配。");
              return;
            }
          } catch {
            state.textContent = "结果未知";
            status.textContent = "操作结果未知；不会自动重试。重新打开卡片可只读恢复。";
            return;
          }

          receipt.textContent = committed.receipt;
          serverTools.textContent = "声明 + 调用成功";
          if (!supportsContext) {
            setPartial("app-only 操作成功，但宿主没有声明文本上下文更新能力。\n");
            return;
          }
          try {
            await request("ui/update-model-context", {
              content: [{
                type: "text",
                text: `ZDecision host capability probe marker: ${committed.marker}`,
              }],
            }, 5000);
            updateContext.textContent = "声明 + 调用成功";
          } catch {
            setPartial("app-only 操作成功，但文本上下文更新失败；不会发送后续消息。\n");
            return;
          }

          if (!supportsMessage) {
            setPartial("上下文已更新；宿主未声明文本后续消息能力。\n");
            return;
          }
          try {
            const result = await request("ui/message", {
              role: "user",
              content: [{
                type: "text",
                text: "请确认已接收到 ZDecision 宿主能力验证上下文。",
              }],
            }, 5000);
            if (isObject(result) && result.isError === true) {
              throw new Error("host rejected message");
            }
            messageCapability.textContent = "声明 + 调用成功";
            state.textContent = "验证完成";
            status.textContent = "三段宿主能力调用均已完成。";
          } catch {
            state.textContent = "后续消息失败";
            status.textContent = "上下文已更新，但后续消息失败或结果未知；不会自动重试。";
          }
        }

        runButton.addEventListener("click", runProbe);
        window.addEventListener("message", (event) => {
          if (event.source !== window.parent) return;
          const value = event.data;
          if (!isObject(value) || value.jsonrpc !== "2.0") return;
          if (Object.hasOwn(value, "id")) {
            const waiter = pending.get(value.id);
            if (!waiter) return;
            pending.delete(value.id);
            clearTimeout(waiter.timer);
            if (value.error) waiter.reject(value.error);
            else waiter.resolve(value.result);
            return;
          }
          if (value.method === "ui/notifications/tool-result") {
            acceptRenderResult(value.params);
          }
        }, { passive: true });

        request("ui/initialize", {
          appInfo: { name: "zdecision-host-probe", version: "1" },
          appCapabilities: {},
          protocolVersion: PROTOCOL_VERSION,
        }, 3000).then((value) => {
          showCapabilities(isObject(value) ? value.hostCapabilities : {});
          initialized = true;
          notify("ui/notifications/initialized", {});
          maybeRecover();
        }).catch(() => {
          state.textContent = "宿主不支持";
          status.textContent = "MCP Apps 初始化失败。";
          runButton.disabled = true;
        });
      })();
    </script>
  </body>
</html>
